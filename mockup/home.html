<title>我的天空</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* Layout: one still picture-book page. Flat crayon sky and hills fill the screen, a dotted path climbs toward the horizon (one dot per session), the date sits top-left, one button sits on the grass. */
:root {
  --sky: #8fcff0;
  --cloud: #fffaf0;
  --sun: #ffd45c;
  --hill-far: #b8dd7c;
  --hill-near: #8dc761;
  --trail: #fff4d8;
  --ink: #3b4757;
  --text: #2c3a4b;
  --paper: #fffaf0;
  --coat: #ee7a5f;
  --skin: #ffe1c4;
  --w-sun: #ffc23d;
  --w-partly: #ffe796;
  --w-cloud: #d8dee5;
  --w-rain: #7fb2e5;
  --w-storm: #9192bd;
  --grain: .22;
  --stars: 0;
  --font: "Huninn", "PingFang TC", "Noto Sans TC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #23396a; --cloud: #4d6190; --sun: #f6e8a6; --hill-far: #3f6a46; --hill-near: #2e5536;
    --trail: #d8cda9; --ink: #0f182c; --text: #f4efe0; --paper: #f4efe0; --coat: #e5866c; --skin: #f1d6ba;
    --w-cloud: #b6becb; --grain: .3; --stars: 1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #23396a; --cloud: #4d6190; --sun: #f6e8a6; --hill-far: #3f6a46; --hill-near: #2e5536;
  --trail: #d8cda9; --ink: #0f182c; --text: #f4efe0; --paper: #f4efe0; --coat: #e5866c; --skin: #f1d6ba;
  --w-cloud: #b6becb; --grain: .3; --stars: 1; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--sky); color: var(--text); font-family: var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .hit:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.page { position: relative; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; }
.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 2;
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px));
  padding-block: 24px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.date { font-size: 15px; letter-spacing: .06em; }
.steps { font-size: 26px; line-height: 1.3; margin-top: 6px; text-wrap: balance; }
.book { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); display: grid; place-items: center; color: #3b4757; }
.book svg { width: 22px; height: 22px; }

.bottom {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: grid; justify-items: center; gap: 10px;
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(26px + env(safe-area-inset-bottom, 0px));
}
.hint { font-size: 13px; color: var(--text); opacity: .8; }
.write { border: 2.5px solid var(--ink); background: var(--paper); color: #2c3a4b; font-size: 19px; padding: 12px 34px; border-radius: 999px; box-shadow: 0 4px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
.write:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

.hit { cursor: pointer; outline: none; }
.dot { transition: transform .2s; transform-box: fill-box; transform-origin: center; }
.hit.on .dot { transform: scale(1.25); }

.bubble {
  position: absolute; z-index: 3; min-width: 150px; max-width: 220px; padding: 10px 14px 12px;
  background: var(--paper); color: #2c3a4b; border: 2.5px solid var(--ink); border-radius: 18px;
  font-size: 14px; line-height: 1.5; transform: translate(-50%, calc(-100% - 18px)); pointer-events: auto;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px; background: var(--paper); border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
.bubble b { display: block; font-size: 16px; font-weight: 400; }
.bubble .song { display: block; margin-top: 4px; font-size: 13px; opacity: .8; }
.bubble button { margin-top: 6px; border: 0; background: none; padding: 0; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

.toast { position: absolute; left: 50%; top: calc(110px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px); opacity: 0; transition: .3s; z-index: 4; background: var(--paper); color: #2c3a4b; border: 2px solid var(--ink); padding: 8px 16px; border-radius: 999px; font-size: 14px; width: max-content; max-width: calc(100% - 40px); text-align: center; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.drift { animation: drift 60s linear infinite; }
.drift.slow { animation-duration: 90s; animation-delay: -40s; }
@keyframes drift { from { transform: translateX(-140px); } to { transform: translateX(520px); } }
.walker { animation: step .9s ease-in-out infinite; }
@keyframes step { 50% { transform: translateY(-2px); } }
.leg-a { animation: leg .9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
.leg-b { animation: leg .9s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: 50% 0; }
@keyframes leg { 0%, 100% { transform: rotate(14deg); } 50% { transform: rotate(-14deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="page" id="page">
  <svg class="scene" id="scene" viewBox="0 0 390 760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="繪本風的藍天和草地，一條小路上有七個圓點，小人站在第七個圓點上">
    <defs>
      <filter id="crayon" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
        <feDisplacementMap in="SourceGraphic" scale="5"/>
      </filter>
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="2" stitchTiles="stitch"/>
        <feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0 0.25  0 0 0 1.2 -0.45"/>
      </filter>
      <g id="cloud">
        <path d="M10 46 C -4 44, 0 22, 20 26 C 22 8, 50 4, 58 20 C 66 8, 92 12, 90 30 C 106 30, 108 48, 94 50 Z"/>
      </g>
    </defs>

    <rect width="390" height="760" fill="var(--sky)"/>

    <g id="stars" style="opacity:var(--stars)" fill="var(--sun)">
      <path d="M60 170 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
      <path d="M150 230 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
      <path d="M230 160 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
      <path d="M340 260 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
      <path d="M100 300 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2z"/>
    </g>

    <g filter="url(#crayon)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="312" cy="196" r="32" fill="var(--sun)"/>
      <g fill="none" class="rays">
        <path d="M312 148 v-12 M312 244 v12 M264 196 h-12 M360 196 h12 M278 162 l-8 -8 M346 230 l8 8 M278 230 l-8 8 M346 162 l8 -8"/>
      </g>

      <g class="drift"><use href="#cloud" fill="var(--cloud)" transform="translate(40 250) scale(1.15)"/></g>
      <g class="drift slow"><use href="#cloud" fill="var(--cloud)" transform="translate(170 320) scale(.8)"/></g>

      <path d="M-10 432 C 60 392, 140 394, 214 414 S 340 382, 400 398 V780 H-10 Z" fill="var(--hill-far)"/>
      <g fill="var(--hill-near)">
        <path d="M335 404 v-24" fill="none"/>
        <circle cx="335" cy="368" r="16"/>
      </g>
      <path d="M-10 478 C 90 444, 196 452, 262 474 S 362 462, 400 452 V780 H-10 Z" fill="var(--hill-near)"/>
      <g fill="none" stroke-width="2">
        <path d="M40 560 l5 -8 l5 8 M60 640 l4 -7 l4 7 M320 560 l5 -8 l5 8 M300 700 l4 -7 l4 7 M180 610 l4 -6 l4 6 M110 690 l4 -7 l4 7"/>
      </g>
    </g>

    <path id="trail" d="M 64 760 C 150 712, 340 700, 300 632 S 84 586, 128 534 S 300 496, 258 458 S 186 432, 214 410" fill="none" stroke="var(--trail)" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 13"/>
    <g id="dots"></g>
    <g id="walker-wrap"></g>

    <rect width="390" height="760" filter="url(#grain)" style="opacity:var(--grain);mix-blend-mode:multiply" pointer-events="none"/>
  </svg>

  <header class="top">
    <div>
      <div class="date" id="today">10月20日 星期二</div>
      <div class="steps">你已經走了 7 次</div>
    </div>
    <button class="book" type="button" aria-label="全部紀錄" data-soon>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/></svg>
    </button>
  </header>

  <div class="bottom">
    <div class="hint">點路上的圓點，看那一次的你</div>
    <button class="write" id="write" type="button">記下今天</button>
  </div>

  <div class="bubble" id="bubble" hidden></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(function () {
  const W = { sun: '晴朗', partly: '有點雲', cloud: '陰天', rain: '下雨', storm: '雷雨' };
  // example sessions, oldest first
  const sessions = [
    { n: 1, date: '9月3日', before: 'storm', after: 'rain' },
    { n: 2, date: '9月10日', before: 'rain', after: 'rain' },
    { n: 3, date: '9月17日', before: 'rain', after: 'cloud' },
    { n: 4, date: '9月24日', before: 'cloud', after: 'cloud' },
    { n: 5, date: '10月1日', before: 'storm', after: 'rain' },
    { n: 6, date: '10月8日', before: 'cloud', after: 'partly' },
    { n: 7, date: '10月15日', before: 'cloud', after: 'partly', song: '回家路上聽的歌（範例）' }
  ];
  const NS = 'http://www.w3.org/2000/svg';
  const trail = document.getElementById('trail');
  const total = trail.getTotalLength();
  const dotsG = document.getElementById('dots');
  const reach = 0.78; // the rest of the path is the road ahead

  const pts = sessions.map((s, i) => {
    const t = (i + 0.4) / (sessions.length - 0.6) * reach;
    const p = trail.getPointAtLength(t * total);
    return { x: p.x, y: p.y, r: 14 - t * 8 };
  });

  sessions.forEach((s, i) => {
    const p = pts[i];
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'hit');
    g.setAttribute('tabindex', '0');
    g.setAttribute('role', 'button');
    g.setAttribute('aria-label', `第 ${s.n} 次諮商，${s.date}，諮商後${W[s.after]}`);
    g.innerHTML = `<circle cx="${p.x}" cy="${p.y}" r="${p.r + 12}" fill="transparent"/>
      <circle class="dot" cx="${p.x}" cy="${p.y}" r="${p.r}" fill="var(--w-${s.after})" stroke="var(--ink)" stroke-width="2.5" filter="url(#crayon)"/>`;
    g.addEventListener('click', e => { e.stopPropagation(); open(i); });
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); } });
    dotsG.appendChild(g);
  });

  // the little walker stands on the latest dot
  const last = pts[pts.length - 1];
  const k = 0.75;
  document.getElementById('walker-wrap').innerHTML = `
    <g transform="translate(${last.x + 4} ${last.y - 6}) scale(${k})" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <g class="walker">
        <path class="leg-a" d="M-4 6 v12" fill="none"/>
        <path class="leg-b" d="M4 6 v12" fill="none"/>
        <path d="M-10 8 C -10 -10, 10 -10, 10 8 Z" fill="var(--coat)"/>
        <circle cx="0" cy="-18" r="9" fill="var(--skin)"/>
        <path d="M-9 -20 C -8 -30, 8 -30, 9 -20 C 4 -24, -4 -24, -9 -20 Z" fill="var(--ink)"/>
      </g>
    </g>`;

  const bubble = document.getElementById('bubble');
  const page = document.getElementById('page');
  let current = -1;
  function open(i) {
    if (current === i) { close(); return; }
    current = i;
    const s = sessions[i];
    [...dotsG.children].forEach((el, j) => el.classList.toggle('on', j === i));
    bubble.innerHTML = `<b>第 ${s.n} 次 · ${s.date}</b>${W[s.before]} → ${W[s.after]}
      ${s.song ? `<span class="song">♪ ${s.song}</span>` : ''}
      <button type="button" data-soon>看這一次的紀錄</button>`;
    bubble.hidden = false;
    place();
  }
  function place() {
    if (current < 0) return;
    const c = dotsG.children[current].querySelector('.dot').getBoundingClientRect();
    const box = page.getBoundingClientRect();
    const half = bubble.offsetWidth / 2;
    let x = c.left + c.width / 2 - box.left;
    x = Math.max(half + 12, Math.min(box.width - half - 12, x));
    bubble.style.left = x + 'px';
    bubble.style.top = (c.top - box.top) + 'px';
  }
  function close() {
    current = -1;
    bubble.hidden = true;
    [...dotsG.children].forEach(el => el.classList.remove('on'));
  }
  window.addEventListener('resize', place);
  document.getElementById('scene').addEventListener('click', close);

  try {
    document.getElementById('today').textContent = new Date().toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'long' });
  } catch (e) {}

  const toast = document.getElementById('toast');
  let tt;
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(tt);
    tt = setTimeout(() => toast.classList.remove('show'), 2400);
  }
  document.getElementById('write').addEventListener('click', () => say('正式版會在這裡問你：諮商前，還是諮商後？'));
  document.addEventListener('click', e => { if (e.target.closest('[data-soon]')) { e.stopPropagation(); say('這一頁還在樣稿階段，之後會做'); } });
})();
</script>

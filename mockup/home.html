<title>我的天空</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* Layout: a side-view picture-book landscape. The sky layer stays still; the land scrolls sideways.
   The path runs left (past) to right (ahead); one dot per session; the walker stands large in the foreground on the newest dot. */
:root {
  --sky: #8fcff0;
  --sky-stroke: #a6daf5;
  --cloud: #fffaf0;
  --sun: #ffd45c;
  --mtn: #a6d2cc;
  --hill-far: #b8dd7c;
  --hill-near: #93ca63;
  --grass-front: #7dba55;
  --sand: #f4e0ae;
  --foot: #d6b77c;
  --tree: #6fae55;
  --tree-2: #8cc45e;
  --trunk: #9a6b47;
  --wall: #fff3df;
  --roof: #e06a52;
  --fence: #c4925f;
  --ink: #3b4757;
  --text: #2c3a4b;
  --paper: #fffaf0;
  --coat: #ee7a5f;
  --scarf: #ffcf4a;
  --pack: #6d9fd8;
  --skin: #ffe1c4;
  --cheek: #f7a99a;
  --boot: #6b4a3a;
  --f1: #ff9fb0; --f2: #ffffff; --f3: #ffd45c; --f4: #b9a3f0;
  --w-sun: #ffc23d; --w-partly: #ffe796; --w-cloud: #d8dee5; --w-rain: #7fb2e5; --w-storm: #9192bd;
  --grain: .2;
  --stars: 0;
  --rays: 1;
  --font: "Huninn", "PingFang TC", "Noto Sans TC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #23396a; --sky-stroke: #2c4479; --cloud: #4d6190; --sun: #f6e8a6; --mtn: #2f4d6a;
    --hill-far: #3f6a46; --hill-near: #2f5838; --grass-front: #264a2f; --sand: #8c7d5c; --foot: #6f6247;
    --tree: #2d5a37; --tree-2: #36663f; --trunk: #5e4330; --wall: #d9cdb2; --roof: #a9503f; --fence: #7c5d40;
    --ink: #0f182c; --text: #f4efe0; --paper: #f4efe0; --coat: #e5866c; --scarf: #e8c05a; --pack: #5f8cc4;
    --skin: #f1d6ba; --cheek: #e39a8c; --boot: #4e372b;
    --f1: #d98a99; --f2: #d9d6cc; --f3: #d9bb5c; --f4: #9b8acb; --w-cloud: #b6becb;
    --grain: .3; --stars: 1; --rays: 0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #23396a; --sky-stroke: #2c4479; --cloud: #4d6190; --sun: #f6e8a6; --mtn: #2f4d6a;
  --hill-far: #3f6a46; --hill-near: #2f5838; --grass-front: #264a2f; --sand: #8c7d5c; --foot: #6f6247;
  --tree: #2d5a37; --tree-2: #36663f; --trunk: #5e4330; --wall: #d9cdb2; --roof: #a9503f; --fence: #7c5d40;
  --ink: #0f182c; --text: #f4efe0; --paper: #f4efe0; --coat: #e5866c; --scarf: #e8c05a; --pack: #5f8cc4;
  --skin: #f1d6ba; --cheek: #e39a8c; --boot: #4e372b;
  --f1: #d98a99; --f2: #d9d6cc; --f3: #d9bb5c; --f4: #9b8acb; --w-cloud: #b6becb;
  --grain: .3; --stars: 1; --rays: 0; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--sky); color: var(--text); font-family: var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .hit:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.page { position: relative; height: 100%; overflow: hidden; }
.back { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.world { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.world::-webkit-scrollbar { display: none; }
.world svg { display: block; height: 100%; width: auto; max-width: none; }
.grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: var(--grain); mix-blend-mode: multiply; }

.top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 2; pointer-events: none;
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px));
  padding-block: 22px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.top > * { pointer-events: auto; }
.date { font-size: 15px; letter-spacing: .06em; }
.steps { font-size: 26px; line-height: 1.3; margin-top: 4px; text-wrap: balance; }
.book { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); display: grid; place-items: center; color: #3b4757; }
.book svg { width: 22px; height: 22px; }

.bottom {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: grid; justify-items: center; gap: 8px; pointer-events: none;
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(22px + env(safe-area-inset-bottom, 0px));
}
.bottom > * { pointer-events: auto; }
.hint { font-size: 13px; color: var(--text); opacity: .85; }
.write { border: 2.5px solid var(--ink); background: var(--paper); color: #2c3a4b; font-size: 19px; padding: 12px 34px; border-radius: 999px; box-shadow: 0 4px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
.write:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

.hit { cursor: pointer; outline: none; }
.dot { transition: transform .2s; transform-box: fill-box; transform-origin: center; }
.hit.on .dot { transform: scale(1.2); }
.lbl { font-family: var(--font); font-size: 13px; fill: var(--text); }

.bubble {
  position: absolute; z-index: 3; min-width: 180px; max-width: 240px; padding: 10px 14px 12px;
  background: var(--paper); color: #2c3a4b; border: 2.5px solid var(--ink); border-radius: 18px;
  font-size: 14px; line-height: 1.5; transform: translate(-50%, calc(-100% - 18px));
}
.bubble::after { content: ""; position: absolute; left: var(--tip, 50%); bottom: -9px; width: 14px; height: 14px; background: var(--paper); border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
.bubble b { display: block; white-space: nowrap; font-size: 16px; font-weight: 400; }
.bubble .song { display: block; margin-top: 4px; font-size: 13px; opacity: .8; }
.bubble button { margin-top: 6px; border: 0; background: none; padding: 0; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

.toast { position: absolute; left: 50%; top: calc(104px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px); opacity: 0; transition: .3s; z-index: 4; background: var(--paper); color: #2c3a4b; border: 2px solid var(--ink); padding: 8px 16px; border-radius: 999px; font-size: 14px; width: max-content; max-width: calc(100% - 40px); text-align: center; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.drift { animation: drift 120s linear infinite; }
.drift.b { animation-duration: 160s; animation-delay: -70s; }
.drift.c { animation-duration: 140s; animation-delay: -30s; }
@keyframes drift { from { transform: translateX(-300px); } to { transform: translateX(1300px); } }
.bird { animation: flap 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flap { 50% { transform: scaleY(.55); } }
.breathe { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes breathe { 50% { transform: scaleY(1.015); } }
.scarf-tail { animation: flutter 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 0; }
@keyframes flutter { 50% { transform: rotate(-12deg); } }
.sway { animation: sway 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
.fly { animation: butterfly 9s ease-in-out infinite; }
@keyframes butterfly { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(18px, -14px); } 50% { transform: translate(34px, 2px); } 75% { transform: translate(14px, 10px); } }
.wing { animation: wing .35s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 50%; }
.wing.r { transform-origin: 0 50%; }
@keyframes wing { 50% { transform: scaleX(.3); } }

@media (max-height: 500px) {
  .hint { display: none; }
  .bottom { justify-items: end; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="page" id="page">
  <!-- still sky layer -->
  <svg class="back" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <filter id="crayon" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
        <feDisplacementMap in="SourceGraphic" scale="4"/>
      </filter>
      <path id="cloud" d="M10 46 C -4 44, 0 22, 20 26 C 22 8, 50 4, 58 20 C 66 8, 92 12, 90 30 C 106 30, 108 48, 94 50 Z"/>
    </defs>
    <rect width="1200" height="600" fill="var(--sky)"/>
    <g stroke="var(--sky-stroke)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#crayon)">
      <path d="M380 120 q40 -6 80 0 M520 210 q50 -6 100 0 M760 260 q40 -5 80 0 M430 300 q30 -4 60 0 M840 110 q30 -4 60 0"/>
    </g>
    <g style="opacity:var(--stars)" fill="var(--sun)">
      <path d="M470 150 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
      <path d="M560 240 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
      <path d="M640 120 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
      <path d="M520 90 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2z"/>
      <path d="M800 200 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
    </g>
    <g filter="url(#crayon)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="700" cy="170" r="30" fill="var(--sun)"/>
      <path style="opacity:var(--rays)" d="M700 124 v-12 M700 216 v12 M654 170 h-12 M746 170 h12 M668 138 l-8 -8 M732 202 l8 8 M668 202 l-8 8 M732 138 l8 -8" fill="none"/>
      <g class="drift"><use href="#cloud" fill="var(--cloud)" transform="translate(0 200) scale(1.1)"/></g>
      <g class="drift b"><use href="#cloud" fill="var(--cloud)" transform="translate(0 255) scale(.75)"/></g>
      <g class="drift c"><use href="#cloud" fill="var(--cloud)" transform="translate(0 150) scale(.6)"/></g>
      <path d="M0 330 L90 270 L150 300 L240 240 L330 305 L420 262 L520 316 L600 266 L690 312 L790 250 L880 300 L960 268 L1060 318 L1200 270 V600 H0 Z" fill="var(--mtn)"/>
      <path d="M240 240 l-18 14 l10 -2 l8 8 l9 -9 l9 3z M790 250 l-18 14 l10 -2 l8 8 l9 -9 l9 3z" fill="var(--cloud)" stroke-width="1.8"/>
    </g>
    <g fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round">
      <path class="bird" d="M560 200 q6 -6 12 0 q6 -6 12 0"/>
      <path class="bird" style="animation-delay:-.5s" d="M592 186 q4 -4 8 0 q4 -4 8 0"/>
    </g>
  </svg>

  <!-- land that scrolls sideways -->
  <div class="world" id="world">
    <svg id="land" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一條往右延伸的小路，路上的圓點是每一次諮商，小人站在最新的圓點上"></svg>
  </div>

  <svg class="grain" aria-hidden="true">
    <filter id="grainf"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0 0.25  0 0 0 1.2 -0.45"/></filter>
    <rect width="100%" height="100%" filter="url(#grainf)"/>
  </svg>

  <header class="top">
    <div>
      <div class="date" id="today">10月20日 星期二</div>
      <div class="steps">你已經走了 7 次</div>
    </div>
    <button class="book" type="button" aria-label="全部紀錄" data-soon>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/></svg>
    </button>
  </header>

  <div class="bottom">
    <div class="hint">滑一滑，看看走過的路</div>
    <button class="write" id="write" type="button">記下今天</button>
  </div>

  <div class="bubble" id="bubble" hidden></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(function () {
  const W = { sun: '晴朗', partly: '有點雲', cloud: '陰天', rain: '下雨', storm: '雷雨' };
  // example sessions, oldest first
  const sessions = [
    { n: 1, date: '9月3日', short: '9/3', before: 'storm', after: 'rain' },
    { n: 2, date: '9月10日', short: '9/10', before: 'rain', after: 'rain' },
    { n: 3, date: '9月17日', short: '9/17', before: 'rain', after: 'cloud' },
    { n: 4, date: '9月24日', short: '9/24', before: 'cloud', after: 'cloud' },
    { n: 5, date: '10月1日', short: '10/1', before: 'storm', after: 'rain' },
    { n: 6, date: '10月8日', short: '10/8', before: 'cloud', after: 'partly' },
    { n: 7, date: '10月15日', short: '10/15', before: 'cloud', after: 'partly', song: '回家路上聽的歌（範例）' }
  ];

  const H = 600, S = 100, X0 = 230, AHEAD = 560;
  const last = X0 + (sessions.length - 1) * S;
  const WIDTH = last + AHEAD;

  // seeded random so the meadow looks the same every visit
  let seed = 11;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  const pathY = x => 470 + 9 * Math.sin(x / 95);
  const groundY = x => 412 + 12 * Math.sin(x / 140 + 1);
  const hillY = x => 336 + 26 * Math.sin(x / 230) + 12 * Math.sin(x / 83 + 2);
  const frontY = x => 548 + 8 * Math.sin(x / 60);

  const wave = (f, step = 16) => { let d = `M -20 ${f(-20).toFixed(1)}`; for (let x = -20; x <= WIDTH + 20; x += step) d += ` L ${x} ${f(x).toFixed(1)}`; return d; };
  const band = f => wave(f) + ` L ${WIDTH + 20} ${H + 20} L -20 ${H + 20} Z`;

  const svg = document.getElementById('land');
  svg.setAttribute('viewBox', `0 0 ${WIDTH} ${H}`);
  svg.style.aspectRatio = `${WIDTH} / ${H}`;

  let out = `
  <defs>
    <filter id="cr" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="var(--ink)" stroke-width="1.2" opacity=".09"/>
    </pattern>
  </defs>`;

  // far hills with trees and a little house near the start
  let hills = `<path d="${band(hillY)}" fill="var(--hill-far)"/><path d="${band(hillY)}" fill="url(#hatch)" stroke="none"/>`;
  for (let x = 60; x < WIDTH; x += 70 + rnd() * 90) {
    const y = hillY(x) + 4, h = 26 + rnd() * 18;
    if (rnd() < .5) {
      hills += `<g class="sway" style="animation-delay:${-rnd() * 4}s"><path d="M${x} ${y} v-${h * .5}" stroke-width="3" fill="none" stroke="var(--trunk)"/><circle cx="${x}" cy="${y - h * .75}" r="${h * .38}" fill="var(--tree)"/></g>`;
    } else {
      hills += `<g class="sway" style="animation-delay:${-rnd() * 4}s"><path d="M${x} ${y - h * 1.1} L${x + h * .32} ${y - 4} L${x - h * .32} ${y - 4} Z" fill="var(--tree-2)"/><path d="M${x} ${y - 4} v4" stroke="var(--trunk)" stroke-width="3"/></g>`;
    }
  }
  const hx = 90, hy = hillY(90) + 6;
  hills += `<g><rect x="${hx - 20}" y="${hy - 30}" width="40" height="30" fill="var(--wall)"/><path d="M${hx - 26} ${hy - 28} L${hx} ${hy - 50} L${hx + 26} ${hy - 28} Z" fill="var(--roof)"/><rect x="${hx - 5}" y="${hy - 16}" width="10" height="16" fill="var(--trunk)"/><rect x="${hx + 8}" y="${hy - 24}" width="7" height="7" fill="var(--sky)"/></g>`;

  // near ground, path, fence
  let ground = `<path d="${band(groundY)}" fill="var(--hill-near)"/><path d="${band(groundY)}" fill="url(#hatch)" stroke="none"/>`;
  let fence = '';
  [[X0 - 160, X0 + 60], [X0 + S * 2.4, X0 + S * 3.9]].forEach(([a, b]) => {
    let posts = '';
    for (let x = a; x <= b; x += 34) posts += `<path d="M${x} ${groundY(x) + 30} v-30" />`;
    fence += `<g stroke="var(--fence)" stroke-width="4" fill="none">${posts}<path d="M${a} ${groundY(a) + 10} L${b} ${groundY(b) + 10} M${a} ${groundY(a) + 20} L${b} ${groundY(b) + 20}" stroke-width="3"/></g>`;
  });
  const roadPast = wave(pathY, 12).replace(/^M -20/, 'M -20');
  ground += fence;
  ground += `<path d="${roadPast}" fill="none" stroke="var(--sand)" stroke-width="40" stroke-linecap="round"/>`;

  // front grass with flowers and tufts
  let front = `<path d="${band(frontY)}" fill="var(--grass-front)"/>`;
  for (let x = 10; x < WIDTH; x += 18 + rnd() * 30) {
    const y = frontY(x) + 10 + rnd() * 30;
    if (rnd() < .55) {
      const c = ['--f1', '--f2', '--f3', '--f4'][Math.floor(rnd() * 4)];
      const r = 3 + rnd() * 2;
      front += `<g class="sway" style="animation-delay:${-rnd() * 4}s"><path d="M${x} ${y + 12} v-12" stroke="var(--tree)" stroke-width="2"/><g fill="var(${c})" stroke-width="1.5">${[0, 72, 144, 216, 288].map(a => `<circle cx="${(x + Math.cos(a * Math.PI / 180) * r).toFixed(1)}" cy="${(y + Math.sin(a * Math.PI / 180) * r).toFixed(1)}" r="${r * .7}"/>`).join('')}</g><circle cx="${x}" cy="${y}" r="${r * .45}" fill="var(--scarf)" stroke="none"/></g>`;
    } else {
      front += `<path class="sway" style="animation-delay:${-rnd() * 4}s" d="M${x - 5} ${y + 8} l3 -10 l2 10 M${x} ${y + 8} l4 -14 l1 14 M${x + 4} ${y + 8} l5 -9" fill="none" stroke="var(--tree)" stroke-width="2"/>`;
    }
  }
  // tufts along the ground edge
  let tufts = '';
  for (let x = 20; x < WIDTH; x += 40 + rnd() * 60) {
    const y = groundY(x) + 22 + rnd() * 20;
    tufts += `<path class="sway" style="animation-delay:${-rnd() * 4}s" d="M${x - 4} ${y} l2 -8 l2 8 M${x} ${y} l3 -11 l1 11 M${x + 4} ${y} l4 -7" fill="none" stroke="var(--tree)" stroke-width="2"/>`;
  }

  out += `<g filter="url(#cr)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">${hills}${ground}${tufts}</g>`;

  // footprints between dots and a softer road ahead
  let prints = '';
  for (let x = 30; x < last - 10; x += 22) prints += `<ellipse cx="${x}" cy="${pathY(x) + (Math.round(x / 22) % 2 ? 5 : -5)}" rx="4.5" ry="2.6" fill="var(--foot)"/>`;
  let ahead = '';
  for (let x = last + 60; x < WIDTH - 40; x += 26) ahead += `<circle cx="${x}" cy="${pathY(x)}" r="3" fill="var(--foot)" opacity=".7"/>`;
  out += prints + ahead;

  // start sign and next-session sign
  const sign = (x, text, w) => {
    const y = groundY(x) + 6;
    return `<g filter="url(#cr)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"><path d="M${x} ${y + 30} v-44" stroke="var(--fence)" stroke-width="5"/><rect x="${x - w / 2}" y="${y - 40}" width="${w}" height="26" rx="5" fill="var(--paper)"/></g><text class="lbl" x="${x}" y="${y - 22}" text-anchor="middle" style="fill:#2c3a4b">${text}</text>`;
  };
  out += sign(X0 - 110, '起點 9/3', 76) + sign(last + 200, '下次 10/22', 86);

  // session dots
  out += `<g id="dots">` + sessions.map((s, i) => {
    const x = X0 + i * S, y = pathY(X0 + i * S);
    return `<g class="hit" tabindex="0" role="button" data-i="${i}" aria-label="第 ${s.n} 次諮商，${s.date}，諮商後${W[s.after]}">
      <circle cx="${x}" cy="${y}" r="30" fill="transparent"/>
      <circle class="dot" cx="${x}" cy="${y}" r="15" fill="var(--w-${s.after})" stroke="var(--ink)" stroke-width="2.5" filter="url(#cr)"/>
      <text class="lbl" x="${x}" y="${y + 36}" text-anchor="middle">${s.short}</text>
    </g>`;
  }).join('') + `</g>`;

  // the walker, large, standing just behind the newest dot
  const wx = last - 4, wy = pathY(last) - 18;
  out += `<g transform="translate(${wx} ${wy})" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cr)">
    <ellipse cx="2" cy="4" rx="22" ry="5" fill="var(--foot)" stroke="none" opacity=".6"/>
    <g class="breathe">
      <path d="M-8 -22 L-10 0 h9 L0 -22 Z" fill="var(--boot)"/>
      <path d="M4 -22 L6 0 h9 L12 -22 Z" fill="var(--boot)"/>
      <rect x="-26" y="-74" width="16" height="30" rx="6" fill="var(--pack)"/>
      <path d="M-16 -22 C -20 -60, -14 -78, 2 -78 C 18 -78, 24 -60, 20 -22 Z" fill="var(--coat)"/>
      <path d="M2 -60 C 14 -56, 18 -46, 22 -40" fill="none"/>
      <circle cx="22" cy="-39" r="4" fill="var(--skin)"/>
      <path d="M-12 -78 C -6 -72, 12 -72, 16 -78 L14 -86 C 6 -82, -6 -82, -12 -86 Z" fill="var(--scarf)"/>
      <path class="scarf-tail" d="M-10 -82 C -22 -80, -30 -74, -36 -70 L-32 -64 C -24 -70, -16 -72, -8 -76 Z" fill="var(--scarf)"/>
      <circle cx="2" cy="-102" r="20" fill="var(--skin)"/>
      <path d="M-18 -104 C -18 -126, 20 -128, 22 -104 C 14 -112, -2 -114, -18 -104 Z" fill="var(--boot)"/>
      <circle cx="12" cy="-100" r="2.2" fill="var(--ink)" stroke="none"/>
      <circle cx="14" cy="-92" r="4" fill="var(--cheek)" stroke="none" opacity=".8"/>
      <path d="M17 -88 q3 2 5 0" fill="none" stroke-width="2"/>
    </g>
  </g>`;

  // a butterfly near the walker
  out += `<g transform="translate(${last + 60} ${pathY(last) - 120})"><g class="fly">
    <path class="wing" d="M0 0 C -10 -12, -16 -2, -8 4 Z" fill="var(--f1)" stroke="var(--ink)" stroke-width="1.6"/>
    <path class="wing r" d="M0 0 C 10 -12, 16 -2, 8 4 Z" fill="var(--f1)" stroke="var(--ink)" stroke-width="1.6"/>
  </g></g>`;

  out += `<g filter="url(#cr)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">${front}</g>`;
  svg.innerHTML = out;

  // start the view on the walker, a little left of center
  const world = document.getElementById('world');
  const scale = () => svg.getBoundingClientRect().height / H;
  function home() { world.scrollLeft = last * scale() - world.clientWidth * 0.64; }
  requestAnimationFrame(home);

  // speech bubble
  const bubble = document.getElementById('bubble');
  const page = document.getElementById('page');
  const dots = [...svg.querySelectorAll('.hit')];
  let current = -1;
  function open(i) {
    if (current === i) { close(); return; }
    current = i;
    const s = sessions[i];
    dots.forEach((el, j) => el.classList.toggle('on', j === i));
    bubble.innerHTML = `<b>第 ${s.n} 次 · ${s.date}</b>${W[s.before]} → ${W[s.after]}
      ${s.song ? `<span class="song">♪ ${s.song}</span>` : ''}
      <button type="button" data-soon>看這一次的紀錄</button>`;
    bubble.hidden = false;
    place();
  }
  function place() {
    if (current < 0) return;
    const c = dots[current].querySelector('.dot').getBoundingClientRect();
    const box = page.getBoundingClientRect();
    const half = bubble.offsetWidth / 2;
    const cx = c.left + c.width / 2 - box.left;
    const x = Math.max(half + 12, Math.min(box.width - half - 12, cx));
    bubble.style.left = x + 'px';
    const lift = current === sessions.length - 1 ? 128 * scale() : 0; // clear the walker
    bubble.style.top = (c.top - box.top - lift) + 'px';
    bubble.style.setProperty('--tip', Math.max(20, Math.min(bubble.offsetWidth - 20, cx - x + half)) + 'px');
    bubble.hidden = cx < -20 || cx > box.width + 20;
  }
  function close() {
    current = -1;
    bubble.hidden = true;
    dots.forEach(el => el.classList.remove('on'));
  }
  dots.forEach((g, i) => {
    g.addEventListener('click', e => { e.stopPropagation(); open(i); });
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); } });
  });
  svg.addEventListener('click', close);
  world.addEventListener('scroll', place, { passive: true });
  window.addEventListener('resize', () => { home(); place(); });

  try {
    document.getElementById('today').textContent = new Date().toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'long' });
  } catch (e) {}

  const toast = document.getElementById('toast');
  let tt;
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(tt);
    tt = setTimeout(() => toast.classList.remove('show'), 2400);
  }
  document.getElementById('write').addEventListener('click', () => say('正式版會在這裡問你：諮商前，還是諮商後？'));
  document.addEventListener('click', e => { if (e.target.closest('[data-soon]')) { e.stopPropagation(); say('這一頁還在樣稿階段，之後會做'); } });
})();
</script>
